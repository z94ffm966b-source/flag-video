<script>
const countries=[
["FR","France","FACILE"],["US","États-Unis","FACILE"],
["GB","Royaume-Uni","FACILE"],["IT","Italie","FACILE"],
["DE","Allemagne","FACILE"],["ES","Espagne","FACILE"],
["JP","Japon","FACILE"],["BR","Brésil","FACILE"],
["CA","Canada","FACILE"],["CN","Chine","FACILE"],
["PT","Portugal","MOYEN"],["GR","Grèce","MOYEN"],
["SE","Suède","MOYEN"],["NO","Norvège","MOYEN"],
["MX","Mexique","MOYEN"],["AR","Argentine","MOYEN"],
["KR","Corée du Sud","MOYEN"],["TR","Turquie","MOYEN"],
["CH","Suisse","MOYEN"],["ZA","Afrique du Sud","MOYEN"],
["LK","Sri Lanka","DIFFICILE"],["BT","Bhoutan","DIFFICILE"],
["KG","Kirghizistan","DIFFICILE"],["MD","Moldavie","DIFFICILE"],
["MZ","Mozambique","DIFFICILE"],["SC","Seychelles","DIFFICILE"],
["SR","Suriname","DIFFICILE"],["TJ","Tadjikistan","DIFFICILE"],
["KI","Kiribati","EXPERT"],["VU","Vanuatu","EXPERT"],
["KM","Comores","EXPERT"],["SZ","Eswatini","EXPERT"],
["NR","Nauru","EXPERT"],["PW","Palaos","EXPERT"],
["TL","Timor oriental","EXPERT"],["ST","Sao Tomé-et-Principe","EXPERT"]
];

const ANSWER_SECONDS=5;
const $=id=>document.getElementById(id);
const canvas=$("screen");
const ctx=canvas.getContext("2d");

let quiz=[];
let images={};
let animation=null;
let busy=false;
let timeline=[];
let audioEvents=[];
let totalDuration=0;

function shuffle(array){
 let a=[...array];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function getHistory(){
 try{
  return JSON.parse(localStorage.getItem("quizzzz_history")||"[]");
 }catch(e){return []}
}

function saveHistory(codes){
 try{
  let history=getHistory();
  history.unshift(codes);
  history=history.slice(0,20);
  localStorage.setItem("quizzzz_history",JSON.stringify(history));
 }catch(e){}
}

function chooseQuiz(){
 const mode=$("difficulty").value;
 let levels;

 if(mode==="mix"){
  levels=["FACILE","MOYEN","DIFFICILE","DIFFICILE","EXPERT"];
 }else if(mode==="hard"){
  levels=["MOYEN","DIFFICILE","DIFFICILE","EXPERT","EXPERT"];
 }else{
  levels=Array.from({length:5},()=> 
   ["FACILE","MOYEN","DIFFICILE","EXPERT"][Math.floor(Math.random()*4)]
  );
 }

 const history=getHistory();
 const recentCodes=new Set(history.slice(0,2).flat());
 const recentSets=new Set(history.map(a=>[...a].sort().join("-")));

 let best=null;
 let bestScore=-Infinity;

 // On essaie plusieurs combinaisons pour limiter les répétitions.
 for(let attempt=0;attempt<100;attempt++){
  const selected=[];
  for(const level of shuffle(levels)){
   let pool=countries.filter(c=>
    c[2]===level&&!selected.some(q=>q[0]===c[0])
   );
   if(!pool.length)pool=countries.filter(c=>!selected.some(q=>q[0]===c[0]));
   selected.push(shuffle(pool)[0]);
  }

  const signature=selected.map(c=>c[0]).sort().join("-");
  const overlap=selected.filter(c=>recentCodes.has(c[0])).length;
  let score=Math.random()*10-overlap*3;
  if(recentSets.has(signature))score-=100;

  if(score>bestScore){
   bestScore=score;
   best=selected;
  }
  if(!recentSets.has(signature)&&overlap<=1)break;
 }

 quiz=best.map(country=>{
  const wrong=shuffle(countries.filter(c=>c[0]!==country[0])).slice(0,3);
  return {country,options:shuffle([country,...wrong])};
 });

 saveHistory(quiz.map(q=>q.country[0]));
}

function status(message){$("status").textContent=message}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function loadFlags(){
 const all=[...new Set(quiz.flatMap(q=>
  [q.country,...q.options].map(c=>c[0])
 ))];

 await Promise.all(all.map(code=>new Promise((resolve,reject)=>{
  if(images[code])return resolve();

  const img=new Image();
  img.crossOrigin="anonymous";
  img.onload=()=>{images[code]=img;resolve()};
  img.onerror=()=>reject(Error("Drapeau impossible à charger : "+code));
  img.src="https://flagcdn.com/w640/"+code.toLowerCase()+".png";
 })));
}

function roundRect(x,y,w,h,r,color,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=color;
 ctx.fill();
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.lineWidth=3;
  ctx.stroke();
 }
}

function background(){
 const g=ctx.createLinearGradient(0,0,1080,1920);
 g.addColorStop(0,"#351052");
 g.addColorStop(.5,"#170725");
 g.addColorStop(1,"#080014");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,1080,1920);

 const glow=ctx.createRadialGradient(300,300,20,300,300,600);
 glow.addColorStop(0,"#a43cff44");
 glow.addColorStop(1,"#a43cff00");
 ctx.fillStyle=glow;
 ctx.fillRect(0,0,1080,1000);

 ctx.fillStyle="#ffffff09";
 for(let i=0;i<35;i++){
  const x=(i*173)%1080;
  const y=(i*293)%1920;
  ctx.beginPath();
  ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fill();
 }
}

function text(value,x,y,size,color,weight="bold"){
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font=weight+" "+size+"px Arial";
 ctx.fillStyle=color;
 ctx.fillText(value,x,y);
}

function drawHeader(){
 text("quizzzz123_",440,150,64,"#ff8bdf");
 roundRect(145,220,590,5,3,"#ffffff22");
}

function drawFlag(code,x,y,w,h){
 const img=images[code];
 if(!img)return;

 const ratio=Math.min(w/img.width,h/img.height);
 const iw=img.width*ratio;
 const ih=img.height*ratio;

 ctx.save();
 ctx.shadowColor="#000";
 ctx.shadowBlur=30;
 roundRect(x-12,y-12,w+24,h+24,24,"#ffffff");
 ctx.restore();

 ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}

function drawIntro(){
 background();
 drawHeader();
 text("🌍",440,610,115,"white");
 text("PRÊT À JOUER ?",440,790,65,"white");
 text($("intro").value,440,930,36,"#edcaff");
 roundRect(145,1080,590,100,28,"#32164e","#a34cff");
 text("5 DRAPEAUX • 5 DÉFIS",440,1130,30,"#ff8bdf");
 text("À TOI DE JOUER !",440,1300,30,"#d6b4f3");
}

function drawQuestion(index,phase,remaining){
 background();
 drawHeader();

 roundRect(130,270,620,13,8,"#ffffff25");
 roundRect(130,270,620*((index+1)/5),13,8,"#ed5bc9");

 text("QUESTION "+(index+1)+" / 5",440,365,34,"#e9c9ff");

 if(phase==="reveal"){
  text("BONNE RÉPONSE !",440,465,43,"#ff9be1");
 }else if(phase==="thinking"){
  text("QUEL EST CE PAYS ?",440,465,43,"white");
 }else{
  text("ÉCOUTE LA QUESTION",440,465,39,"#ffb4e9");
 }

 const q=quiz[index];
 drawFlag(q.country[0],235,565,410,255);

 const positions=[
  [115,980],[450,980],
  [115,1200],[450,1200]
 ];

 q.options.forEach((option,i)=>{
  const [x,y]=positions[i];
  const correct=option[0]===q.country[0];
  const color=phase==="reveal"&&correct?"#147a48":"#29163e";
  const stroke=phase==="reveal"&&correct?"#55f0a0":"#68428a";

  roundRect(x,y,300,180,24,color,stroke);
  text(String(i+1),x+150,y+47,32,"#ff8bdd");

  ctx.font="bold 25px Arial";
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(option[1],x+150,y+115,260);
 });

 if(phase==="reveal"){
  roundRect(125,1460,630,100,25,"#421b58","#f17bda");
  text("✓ "+q.country[1].toUpperCase(),440,1510,35,"white");
 }else if(phase==="thinking"){
  const value=Math.max(0,remaining);
  ctx.beginPath();
  ctx.arc(440,1500,58,-Math.PI/2,-Math.PI/2+Math.PI*2*(value/ANSWER_SECONDS));
  ctx.strokeStyle="#ff70d7";
  ctx.lineWidth=12;
  ctx.stroke();
  text(String(Math.ceil(value)),440,1500,55,"white");
 }
}

function drawEnd(){
 background();
 drawHeader();
 text("🏆",440,580,120,"#ff8bdc");
 text("ALORS ?",440,770,65,"white");
 text("TON SCORE SUR 5 ?",440,900,48,"#ffb5e9");
 roundRect(120,1080,640,125,28,"#39164e","#a54cff");
 text("ABONNE-TOI !",440,1142,48,"white");
 text("POUR LES PROCHAINS QUIZ",440,1260,31,"#e6caff");
 text("quizzzz123_",440,1430,34,"#ff8bdf");
}

function addScene(type,start,end,extra={}){
 if(end>start)timeline.push({type,start,end,...extra});
}

function renderAt(time){
 const scene=timeline.find(s=>time>=s.start&&time<s.end);

 if(!scene){
  if(time<0)drawIntro();
  else if(time>=totalDuration)drawEnd();
  else drawIntro();
  return;
 }

 if(scene.type==="intro"){
  drawIntro();
 }else if(scene.type==="questionIntro"){
  drawQuestion(scene.index,"intro",0);
 }else if(scene.type==="thinking"){
  drawQuestion(scene.index,"thinking",Math.max(0,ANSWER_SECONDS-(time-scene.start)));
 }else if(scene.type==="reveal"){
  drawQuestion(scene.index,"reveal",0);
 }else if(scene.type==="end"){
  drawEnd();
 }
}

async function getVoice(){
 const gender=$("voice").value;
 const url="https://api.tts.ai/v1/voices/?language=fr&model=kokoro&gender="+gender;

 let response=await fetch(url);
 if(!response.ok){
  response=await fetch("https://api.tts.ai/v1/voices/?language=fr");
 }
 if(!response.ok)throw Error("Impossible de récupérer les voix françaises.");

 const data=await response.json();
 const voices=data.voices||[];

 let selected=voices.find(v=>
  (v.gender||"").toLowerCase()===gender &&
  (v.language||"").toLowerCase().startsWith("fr")
 );

 if(!selected){
  selected=voices.find(v=>
   (v.language||"").toLowerCase().startsWith("fr")
  );
 }

 if(!selected)throw Error("Aucune voix française disponible.");
 return selected.id;
}

async function speech(value,voice){
 const response=await fetch("https://api.tts.ai/v1/tts/",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   model:"kokoro",
   text:value,
   voice:voice,
   language:"fr",
   format:"mp3",
   speed:1
  })
 });

 if(!response.ok){
  throw Error("Erreur TTS.ai : "+response.status);
 }

 const job=await response.json();
 if(!job.uuid)throw Error("La génération vocale n'a pas retourné d'identifiant.");

 for(let i=0;i<120;i++){
  await wait(1500);

  const check=await fetch(
   "https://api.tts.ai/v1/speech/results/?uuid="+encodeURIComponent(job.uuid)
  );

  if(!check.ok)continue;

  const result=await check.json();

  if(result.status==="failed"){
   throw Error(result.error||"La voix n'a pas pu être générée.");
  }

  if(result.status==="completed"&&result.result_url){
   const audioResponse=await fetch(result.result_url);
   if(!audioResponse.ok)throw Error("Impossible de télécharger le fichier audio.");
   return await audioResponse.arrayBuffer();
  }
 }

 throw Error("La génération vocale prend trop de temps.");
}

async function prepareAudio(audioContext){
 const voice=await getVoice();
 const segments=[];

 status("Création de la voix d'introduction...");
 const intro=await speech($("intro").value,voice);
 segments.push({
  type:"intro",
  buffer:await audioContext.decodeAudioData(intro)
 });

 for(let i=0;i<quiz.length;i++){
  status("Préparation des voix : question "+(i+1)+"/5...");

  const questionAudio=await speech(
   "Drapeau numéro "+(i+1)+". Quel est ce pays ?",
   voice
  );

  const answerAudio=await speech(
   "La bonne réponse est "+quiz[i].country[1]+".",
   voice
  );

  segments.push({
   type:"question",
   index:i,
   question:await audioContext.decodeAudioData(questionAudio),
   answer:await audioContext.decodeAudioData(answerAudio)
  });
 }

 status("Préparation de la phrase finale...");
 const outroAudio=await speech(
  "Alors, donne ton score sur cinq et abonne-toi pour les prochains quiz !",
  voice
 );

 segments.push({
  type:"outro",
  buffer:await audioContext.decodeAudioData(outroAudio)
 });

 return segments;
}

function buildTimeline(segments){
 timeline=[];
 audioEvents=[];
 let cursor=0;

 function addAudio(buffer){
  audioEvents.push({buffer,start:cursor});
  cursor+=buffer.duration;
 }

 // Introduction : aucune période vide après l'intro.
 const introDuration=segments[0].buffer.duration;
 addScene("intro",cursor,cursor+introDuration+0.5);
 addAudio(segments[0].buffer);
 cursor+=0.5;

 for(let i=1;i<=5;i++){
  const segment=segments[i];

  // Question parlée.
  const questionStart=cursor;
  addAudio(segment.question);
  addScene("questionIntro",questionStart,cursor,{index:segment.index});

  // 5 secondes de réflexion après la fin de la question.
  const thinkingStart=cursor;
  addScene("thinking",thinkingStart,thinkingStart+ANSWER_SECONDS,{index:segment.index});
  cursor+=ANSWER_SECONDS;

  // Réponse et voix démarrent exactement ensemble.
  const revealStart=cursor;
  addAudio(segment.answer);
  addScene("reveal",revealStart,cursor,{index:segment.index});

  // Petite pause après la réponse.
  const pauseStart=cursor;
  cursor+=0.6;
  addScene("reveal",pauseStart,cursor,{index:segment.index});
 }

 // L'écran final apparaît uniquement avec la phrase finale.
 const outro=segments[6].buffer;
 const outroStart=cursor;
 addAudio(outro);
 cursor+=outro.duration;
 addScene("end",outroStart,cursor+2);

 totalDuration=cursor+2;
}

async function recordOneVideo(){
 let audioContext=null;
 let videoStream=null;
 let stream=null;
 let raf=0;
 let sources=[];
 let recorder=null;

 try{
  status("Chargement des drapeaux...");
  await loadFlags();

  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)throw Error("AudioContext non disponible.");

  audioContext=new AudioContextClass();
  await audioContext.resume();

  status("Préparation des voix...");
  const segments=await prepareAudio(audioContext);
  buildTimeline(segments);

  if(!canvas.captureStream||!window.MediaRecorder){
   throw Error("Enregistrement non compatible. Essaie Chrome sur ordinateur.");
  }

  const mimeTypes=[
   "video/mp4;codecs=avc1,mp4a.40.2",
   "video/mp4",
   "video/webm;codecs=vp9,opus",
   "video/webm;codecs=vp8,opus",
   "video/webm"
  ];

  const mimeType=mimeTypes.find(type=>MediaRecorder.isTypeSupported(type));
  if(!mimeType)throw Error("Aucun format vidéo compatible trouvé.");

  const audioDestination=audioContext.createMediaStreamDestination();
  videoStream=canvas.captureStream(30);

  stream=new MediaStream([
   ...videoStream.getVideoTracks(),
   ...audioDestination.stream.getAudioTracks()
  ]);

  recorder=new MediaRecorder(stream,{mimeType});
  const chunks=[];

  recorder.ondataavailable=event=>{
   if(event.data&&event.data.size>0)chunks.push(event.data);
  };

  const recordingFinished=new Promise((resolve,reject)=>{
   recorder.onstop=resolve;
   recorder.onerror=()=>reject(Error("Erreur pendant l'enregistrement vidéo."));
  });

  renderAt(0);
  recorder.start(250);

  const audioStart=audioContext.currentTime+0.35;

  audioEvents.forEach(event=>{
   const source=audioContext.createBufferSource();
   source.buffer=event.buffer;
   source.connect(audioDestination);
   source.start(audioStart+event.start);
   sources.push(source);
  });

  await new Promise((resolve,reject)=>{
   function frame(){
    if(audioContext.state==="closed"){
     reject(Error("Le moteur audio s'est arrêté."));
     return;
    }

    const elapsed=audioContext.currentTime-audioStart;
    const currentTime=Math.max(0,elapsed);
    renderAt(currentTime);

    const percent=Math.min(100,Math.floor(currentTime/totalDuration*100));
    status("Enregistrement : "+percent+" %");

    if(currentTime>=totalDuration){
     renderAt(totalDuration);
     resolve();
     return;
    }

    raf=requestAnimationFrame(frame);
   }

   raf=requestAnimationFrame(frame);
  });

  cancelAnimationFrame(raf);
  await wait(150);
  recorder.stop();
  await recordingFinished;

  return new Blob(chunks,{type:mimeType});

 }finally{
  if(raf)cancelAnimationFrame(raf);

  if(recorder&&recorder.state!=="inactive"){
   try{recorder.stop()}catch(e){}
  }

  sources.forEach(source=>{try{source.stop()}catch(e){}});
  if(stream)stream.getTracks().forEach(track=>track.stop());
  if(videoStream)videoStream.getTracks().forEach(track=>track.stop());

  if(audioContext&&audioContext.state!=="closed"){
   await audioContext.close();
  }
 }
}

function downloadBlob(blob,filename){
 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");
 link.href=url;
 link.download=filename;
 document.body.appendChild(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),120000);
}

async function generateSingle(){
 if(busy)return;
 busy=true;
 setButtons(true);

 try{
  if(!quiz.length)chooseQuiz();
  if(animation){cancelAnimationFrame(animation);animation=null;}

  const blob=await recordOneVideo();
  const extension=blob.type.includes("mp4")?"mp4":"webm";
  downloadBlob(blob,"quizzzz123_"+Date.now()+"."+extension);
  status("Vidéo terminée ! Vérifie tes téléchargements.");
 }catch(error){
  status("Erreur : "+error.message);
 }finally{
  busy=false;
  setButtons(false);
 }
}

async function generateFive(){
 if(busy)return;

 if(typeof JSZip==="undefined"){
  status("Impossible de charger le système ZIP. Vérifie ta connexion puis recharge la page.");
  return;
 }

 busy=true;
 setButtons(true);

 try{
  if(animation){cancelAnimationFrame(animation);animation=null;}

  const zip=new JSZip();
  let extension="webm";

  for(let i=0;i<5;i++){
   status("Préparation de la vidéo "+(i+1)+"/5...");

   // Un nouveau quiz indépendant pour chaque vidéo.
   chooseQuiz();

   const blob=await recordOneVideo();
   extension=blob.type.includes("mp4")?"mp4":"webm";

   zip.file(
    "quizzzz123_video_"+(i+1)+"."+extension,
    blob
   );

   status("Vidéo "+(i+1)+"/5 terminée !\nPréparation de la suite...");
  }

  status("Création du fichier ZIP...");
  const zipBlob=await zip.generateAsync({
   type:"blob",
   compression:"DEFLATE",
   compressionOptions:{level:3}
  },metadata=>{
   status("Création du ZIP : "+Math.floor(metadata.percent)+" %");
  });

  downloadBlob(zipBlob,"quizzzz123_5_videos.zip");
  status("Terminé ! Ton ZIP contient les 5 vidéos séparées.");
 }catch(error){
  status("Erreur : "+error.message+"\nLes vidéos déjà créées n'ont pas forcément été téléchargées.");
 }finally{
  busy=false;
  setButtons(false);
 }
}

function setButtons(disabled){
 $("generate").disabled=disabled;
 $("generateFive").disabled=disabled;
 $("newQuiz").disabled=disabled;
 $("previewBtn").disabled=disabled;
}

$("newQuiz").onclick=()=>{
 if(busy)return;
 if(animation){
  cancelAnimationFrame(animation);
  animation=null;
 }
 chooseQuiz();
 drawIntro();
 status("Nouveau quiz créé !");
};

$("previewBtn").onclick=async()=>{
 if(busy)return;

 try{
  if(!quiz.length)chooseQuiz();
  status("Chargement des drapeaux...");
  await loadFlags();

  if(animation)cancelAnimationFrame(animation);

  const start=performance.now();

  function loop(now){
   const t=(now-start)/1000;

   if(t<2.5){
    drawIntro();
   }else{
    const elapsed=t-2.5;
    let index=0;
    let local=elapsed;

    // Aperçu visuel simplifié : 5 s de réflexion par question.
    while(index<5){
     const questionDuration=ANSWER_SECONDS+3;
     if(local<questionDuration)break;
     local-=questionDuration;
     index++;
    }

    if(index>=5){
     drawEnd();
    }else if(local<ANSWER_SECONDS){
     drawQuestion(index,"thinking",ANSWER_SECONDS-local);
    }else{
     drawQuestion(index,"reveal",0);
    }
   }

   animation=requestAnimationFrame(loop);
  }

  animation=requestAnimationFrame(loop);
  status("Aperçu visuel lancé. La voix est intégrée à la génération vidéo.");
 }catch(error){
  status("Erreur : "+error.message);
 }
};

$("generate").onclick=generateSingle;
$("generateFive").onclick=generateFive;

chooseQuiz();
drawIntro();
</script>
</body>
</html>
