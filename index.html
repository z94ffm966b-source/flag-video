
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090014">
<title>quizzzz123_</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:radial-gradient(circle at top,#35105b,#090014 70%);color:white;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto}
header{text-align:center;padding:12px}
h1{font-size:35px;margin:5px;background:linear-gradient(90deg,#fff,#ff69d4,#a66bff);background-clip:text;color:transparent}
header p,.hint{color:#bba9d0;font-size:13px;line-height:1.5}
.panel{background:#190b2c;border:1px solid #482766;border-radius:19px;padding:17px;margin:15px 0}
label{display:block;font-weight:bold;margin:15px 0 7px}
select,input{width:100%;padding:13px;border-radius:11px;background:#10071c;color:white;border:1px solid #69438a;font-size:14px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(100deg,#913cff,#ee55c8);color:white;font-weight:bold;font-size:15px;margin-top:12px}
button.secondary{background:#302044;border:1px solid #67408a}
button:disabled{opacity:.5}
.preview{width:min(100%,300px);aspect-ratio:9/16;margin:15px auto;background:#10051d;border:1px solid #69438a;border-radius:14px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.status{font-size:13px;color:#e4c7ff;line-height:1.6;margin-top:12px;white-space:pre-wrap}
audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<main>
<header>
<h1>quizzzz123_</h1>
<p>QUIZ FACTORY · TIKTOK EDITION</p>
</header>

<section class="panel">
<label>Phrase d'introduction</label>
<select id="intro">
<option>Seras-tu capable de trouver les 5 pays ?</option>
<option>Arriveras-tu à faire un sans-faute ?</option>
<option>Seuls les vrais experts feront 5 sur 5 !</option>
<option>Connais-tu vraiment les drapeaux du monde ?</option>
</select>

<label>Difficulté</label>
<select id="difficulty">
<option value="mix">Mélange équilibré</option>
<option value="random">Totalement aléatoire</option>
<option value="hard">Plutôt difficile</option>
</select>

<label>Voix française MP3</label>
<p class="hint">1. Génère ta voix sur TTSMP3. 2. Télécharge le MP3. 3. Importe-le ici.</p>
<input id="audioFile" type="file" accept="audio/mpeg,audio/mp3,audio/*">
<audio id="audioPreview" controls hidden></audio>

<button id="newQuiz">🎲 Nouveau quiz</button>
<button id="previewBtn" class="secondary">▶ Aperçu animé</button>
<button id="generate">⬇ Générer la vidéo avec la voix</button>

<div class="status" id="status">Prêt ! Choisis tes paramètres.</div>
</section>

<section class="panel">
<h3 style="text-align:center">APERÇU VIDÉO</h3>
<div class="preview">
<canvas id="screen" width="540" height="960"></canvas>
</div>
<p class="hint" style="text-align:center">Format vertical TikTok 9:16 · 1080 × 1920 à l'export si compatible.</p>
</section>
</main>

<script>
const countries=[
["FR","France","FACILE"],["US","États-Unis","FACILE"],
["GB","Royaume-Uni","FACILE"],["IT","Italie","FACILE"],
["DE","Allemagne","FACILE"],["ES","Espagne","FACILE"],
["JP","Japon","FACILE"],["BR","Brésil","FACILE"],
["CA","Canada","FACILE"],["CN","Chine","FACILE"],
["PT","Portugal","MOYEN"],["GR","Grèce","MOYEN"],
["SE","Suède","MOYEN"],["NO","Norvège","MOYEN"],
["MX","Mexique","MOYEN"],["AR","Argentine","MOYEN"],
["KR","Corée du Sud","MOYEN"],["TR","Turquie","MOYEN"],
["CH","Suisse","MOYEN"],["ZA","Afrique du Sud","MOYEN"],
["LK","Sri Lanka","DIFFICILE"],["BT","Bhoutan","DIFFICILE"],
["KG","Kirghizistan","DIFFICILE"],["MD","Moldavie","DIFFICILE"],
["MZ","Mozambique","DIFFICILE"],["SC","Seychelles","DIFFICILE"],
["SR","Suriname","DIFFICILE"],["TJ","Tadjikistan","DIFFICILE"],
["KI","Kiribati","EXPERT"],["VU","Vanuatu","EXPERT"],
["KM","Comores","EXPERT"],["SZ","Eswatini","EXPERT"],
["NR","Nauru","EXPERT"],["PW","Palaos","EXPERT"],
["TL","Timor oriental","EXPERT"],["ST","Sao Tomé-et-Principe","EXPERT"]
];

const $=id=>document.getElementById(id);
const canvas=$("screen");
const ctx=canvas.getContext("2d");
let quiz=[];
let images={};
let audioURL=null;
let animation=null;
let busy=false;

function shuffle(a){
 let b=[...a];
 for(let i=b.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}

function chooseQuiz(){
 let mode=$("difficulty").value;
 let levels=mode==="mix"
 ?["FACILE","FACILE","MOYEN","DIFFICILE","EXPERT"]
 :mode==="hard"
 ?["MOYEN","DIFFICILE","DIFFICILE","EXPERT","EXPERT"]
 :Array.from({length:5},()=>["FACILE","MOYEN","DIFFICILE","EXPERT"][Math.floor(Math.random()*4)]);

 quiz=[];
 for(let level of shuffle(levels)){
  let pool=countries.filter(c=>c[2]===level&&!quiz.some(q=>q.country[0]===c[0]));
  if(!pool.length)pool=countries.filter(c=>!quiz.some(q=>q.country[0]===c[0]));
  let country=shuffle(pool)[0];
  let wrong=shuffle(countries.filter(c=>c[0]!==country[0])).slice(0,3);
  quiz.push({country,options:shuffle([country,...wrong])});
 }
}

function status(s){$("status").textContent=s}

function loadFlags(){
 let all=[...new Set(quiz.flatMap(q=>[q.country,...q.options].map(c=>c[0])))];
 return Promise.all(all.map(code=>new Promise((resolve,reject)=>{
  if(images[code])return resolve();
  let img=new Image();
  img.crossOrigin="anonymous";
  img.onload=()=>{images[code]=img;resolve()};
  img.onerror=()=>reject(Error("Drapeau impossible à charger : "+code));
  img.src="https://flagcdn.com/w640/"+code.toLowerCase()+".png";
 })));
}

function background(){
 let g=ctx.createLinearGradient(0,0,540,960);
 g.addColorStop(0,"#351052");
 g.addColorStop(1,"#090014");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,540,960);
}

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawFlag(code,x,y,w,h){
 let img=images[code];
 if(!img)return;
 let ratio=Math.min(w/img.width,h/img.height);
 let iw=img.width*ratio,ih=img.height*ratio;
 ctx.fillStyle="white";
 ctx.fillRect(x+(w-iw)/2-5,y+(h-ih)/2-5,iw+10,ih+10);
 ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}

function draw(time){
 background();
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle="#ff8bdc";
 ctx.font="bold 25px Arial";
 ctx.fillText("quizzzz123_",270,75);

 if(time<2.5){
  ctx.fillStyle="white";
  ctx.font="bold 38px Arial";
  ctx.fillText("🌍 PRÊT À JOUER ?",270,420);
  ctx.font="bold 24px Arial";
  ctx.fillStyle="#e9caff";
  ctx.fillText($("intro").value,270,520);
  ctx.fillStyle="#ff77d9";
  ctx.font="bold 20px Arial";
  ctx.fillText("5 DRAPEAUX · 5 DÉFIS",270,630);
  return;
 }

 let t=time-2.5;
 let index=Math.floor(t/8);

 if(index>=5){
  ctx.fillStyle="white";
  ctx.font="bold 38px Arial";
  ctx.fillText("TON SCORE ?",270,420);
  ctx.fillStyle="#ff70d4";
  ctx.font="bold 65px Arial";
  ctx.fillText("?/5",270,520);
  ctx.fillStyle="white";
  ctx.font="bold 22px Arial";
  ctx.fillText("DIS-LE EN COMMENTAIRE !",270,630);
  return;
 }

 let local=t-index*8;
 let reveal=local>=6;
 let q=quiz[index];
 let country=q.country;

 ctx.fillStyle="#e6d4f7";
 ctx.font="bold 24px Arial";
 ctx.fillText("DRAPEAU "+(index+1)+" / 5",270,175);

 ctx.fillStyle="white";
 ctx.font="bold 26px Arial";
 ctx.fillText(reveal?"LA BONNE RÉPONSE":"QUEL EST CE PAYS ?",270,265);

 drawFlag(country[0],60,330,420,270);

 ctx.font="bold 22px Arial";
 q.options.forEach((option,i)=>{
  let y=650+i*61;
  let correct=option[0]===country[0];
  let color=reveal&&correct?"#147a48":"#29163e";
  rounded(55,y,430,49,12,color);
  ctx.fillStyle="white";
  ctx.fillText((i+1)+".  "+option[1],270,y+25);
 });

 if(reveal){
  ctx.fillStyle="#ff9be1";
  ctx.font="bold 21px Arial";
  ctx.fillText("BRAVO SI TU AVAIS TROUVÉ !",270,920);
 }else{
  ctx.fillStyle="#ff77d9";
  ctx.font="bold 45px Arial";
  ctx.fillText(String(Math.max(1,Math.ceil(6-local))),270,590);
 }
}

$("newQuiz").onclick=()=>{
 chooseQuiz();
 draw(0);
 status("Nouveau quiz créé : 5 pays et 4 propositions par question.");
};

$("audioFile").onchange=()=>{
 let file=$("audioFile").files[0];
 if(!file)return;
 if(audioURL)URL.revokeObjectURL(audioURL);
 audioURL=URL.createObjectURL(file);
 $("audioPreview").src=audioURL;
 $("audioPreview").hidden=false;
 status("MP3 chargé. Vérifie que le son correspond à ton quiz.");
};

$("previewBtn").onclick=async()=>{
 try{
  if(!quiz.length)chooseQuiz();
  status("Chargement des drapeaux...");
  await loadFlags();
  if(animation)cancelAnimationFrame(animation);
  let start=performance.now();
  function loop(now){
   draw((now-start)/1000%42.5);
   animation=requestAnimationFrame(loop);
  }
  animation=requestAnimationFrame(loop);
  status("Aperçu animé lancé.");
 }catch(e){status("Erreur : "+e.message)}
};

function wait(ms){return new Promise(r=>setTimeout(r,ms))}

async function generate(){
 if(busy)return;
 busy=true;
 $("generate").disabled=true;
 let audioContext=null;
 let stream=null;
 try{
  if(!quiz.length)chooseQuiz();
  if(!audioURL)throw Error("Importe d'abord ton MP3 français.");
  if(animation)cancelAnimationFrame(animation);

  status("Chargement des drapeaux...");
  await loadFlags();

  if(!canvas.captureStream||!window.MediaRecorder)
   throw Error("Ton navigateur ne prend pas en charge l'export vidéo avec son. Essaie sur un ordinateur avec Chrome.");

  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  await audioContext.resume();

  let response=await fetch(audioURL);
  let audioBlob=await response.blob();
  let arrayBuffer=await audioBlob.arrayBuffer();
  let decoded=await audioContext.decodeAudioData(arrayBuffer);

  const videoStream=canvas.captureStream(30);
  const destination=audioContext.createMediaStreamDestination();
  const source=audioContext.createBufferSource();
  source.buffer=decoded;
  source.connect(destination);

  stream=new MediaStream([
   ...videoStream.getVideoTracks(),
   ...destination.stream.getAudioTracks()
  ]);

  const formats=[
   "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
   "video/mp4",
   "video/webm;codecs=vp9,opus",
   "video/webm;codecs=vp8,opus",
   "video/webm"
  ];
  const mime=formats.find(x=>MediaRecorder.isTypeSupported(x));
  if(!mime)throw Error("Format vidéo avec audio non compatible.");

  let recorder=new MediaRecorder(stream,{mimeType:mime});
  let chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};

  let finished=new Promise((resolve,reject)=>{
   recorder.onstop=resolve;
   recorder.onerror=()=>reject(Error("Erreur d'enregistrement."));
  });

  recorder.start();
  source.start();

  let duration=Math.max(42.5,decoded.duration);
  let start=performance.now();

  while((performance.now()-start)/1000<duration){
   let seconds=(performance.now()-start)/1000;
   draw(seconds);
   status("Création de la vidéo avec voix : "+Math.min(99,Math.floor(seconds/duration*100))+" %");
   await wait(50);
  }

  recorder.stop();
  source.stop();
  await finished;

  stream.getTracks().forEach(t=>t.stop());
  videoStream.getTracks().forEach(t=>t.stop());

  let blob=new Blob(chunks,{type:mime});
  let ext=mime.includes("mp4")?"mp4":"webm";
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download="quizzzz123_"+Date.now()+"."+ext;
  document.body.appendChild(a);
  a.click();
  a.remove();

  status("Vidéo exportée avec la piste audio intégrée ! Format : "+ext.toUpperCase()+". Vérifie tes téléchargements.");
  setTimeout(()=>URL.revokeObjectURL(url),60000);

 }catch(e){
  status("Erreur : "+e.message);
 }finally{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(audioContext)await audioContext.close();
  busy=false;
  $("generate").disabled=false;
 }
}

$("generate").onclick=generate;
chooseQuiz();
draw(0);
</script>
</body>
</html>
