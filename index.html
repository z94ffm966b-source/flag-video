
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080014">
<title>quizzzz123_ — Quiz Factory</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;color:white;font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at 50% 0%,#542080 0%,#160725 45%,#08000f 100%);
}
main{max-width:760px;margin:auto}
header{text-align:center;padding:18px 5px}
h1{
 font-size:38px;margin:0;
 background:linear-gradient(90deg,#fff,#ff72d8,#a77aff);
 -webkit-background-clip:text;background-clip:text;color:transparent;
}
header p{color:#c9a9e6;letter-spacing:3px;font-size:11px}
.panel{
 background:linear-gradient(145deg,#211033,#12091f);
 border:1px solid #59317b;border-radius:22px;
 padding:19px;margin:16px 0;
 box-shadow:0 12px 35px #0006;
}
label{display:block;font-weight:bold;margin:15px 0 8px}
select{
 width:100%;padding:14px;border-radius:12px;
 background:#10071c;color:white;border:1px solid #704795;font-size:15px
}
button{
 width:100%;padding:16px;border:0;border-radius:13px;
 background:linear-gradient(100deg,#873cff,#ed4fc6);
 color:white;font-weight:bold;font-size:15px;margin-top:12px;
 box-shadow:0 5px 18px #a33aff44;
}
button.secondary{background:#302044;border:1px solid #67408a;box-shadow:none}
button:disabled{opacity:.45}
.preview{
 width:min(100%,330px);aspect-ratio:9/16;margin:18px auto;
 border:2px solid #8d54bd;border-radius:18px;overflow:hidden;
 box-shadow:0 0 35px #a044ff44;
}
canvas{width:100%;height:100%;display:block}
.hint{font-size:13px;color:#c3add5;line-height:1.6}
.status{font-size:13px;color:#e8caff;line-height:1.6;margin-top:14px;white-space:pre-wrap}
audio{width:100%;margin-top:12px}
</style>
</head>
<body>
<main>
<header>
<h1>quizzzz123_</h1>
<p>ULTIMATE FLAG QUIZ</p>
</header>

<section class="panel">
<label>Phrase d'introduction</label>
<select id="intro">
<option>Seras-tu capable de trouver les 5 pays ?</option>
<option>Arriveras-tu à faire un sans-faute ?</option>
<option>Seuls les vrais experts feront 5 sur 5 !</option>
<option>Connais-tu vraiment les drapeaux du monde ?</option>
</select>

<label>Difficulté</label>
<select id="difficulty">
<option value="mix">Mélange équilibré</option>
<option value="random">Totalement aléatoire</option>
<option value="hard">Plutôt difficile</option>
</select>

<label>Voix</label>
<select id="voice">
<option value="female">Voix féminine</option>
<option value="male">Voix masculine</option>
</select>

<button id="newQuiz">🎲 Créer un nouveau quiz</button>
<button id="previewBtn" class="secondary">▶ Aperçu animé</button>
<button id="generate">🎬 Générer ma vidéo</button>
<div class="status" id="status">Prêt à créer ton quiz !</div>
<audio id="audioPreview" controls hidden></audio>
</section>

<section class="panel">
<h3 style="text-align:center">APERÇU TIKTOK</h3>
<div class="preview">
<canvas id="screen" width="1080" height="1920"></canvas>
</div>
<p class="hint" style="text-align:center">
Format vertical 9:16. Les réponses et le contenu principal sont placés dans une zone de sécurité, à l'écart des boutons TikTok.
</p>
</section>
</main>

<script>
const countries=[
["FR","France","FACILE"],["US","États-Unis","FACILE"],
["GB","Royaume-Uni","FACILE"],["IT","Italie","FACILE"],
["DE","Allemagne","FACILE"],["ES","Espagne","FACILE"],
["JP","Japon","FACILE"],["BR","Brésil","FACILE"],
["CA","Canada","FACILE"],["CN","Chine","FACILE"],
["PT","Portugal","MOYEN"],["GR","Grèce","MOYEN"],
["SE","Suède","MOYEN"],["NO","Norvège","MOYEN"],
["MX","Mexique","MOYEN"],["AR","Argentine","MOYEN"],
["KR","Corée du Sud","MOYEN"],["TR","Turquie","MOYEN"],
["CH","Suisse","MOYEN"],["ZA","Afrique du Sud","MOYEN"],
["LK","Sri Lanka","DIFFICILE"],["BT","Bhoutan","DIFFICILE"],
["KG","Kirghizistan","DIFFICILE"],["MD","Moldavie","DIFFICILE"],
["MZ","Mozambique","DIFFICILE"],["SC","Seychelles","DIFFICILE"],
["SR","Suriname","DIFFICILE"],["TJ","Tadjikistan","DIFFICILE"],
["KI","Kiribati","EXPERT"],["VU","Vanuatu","EXPERT"],
["KM","Comores","EXPERT"],["SZ","Eswatini","EXPERT"],
["NR","Nauru","EXPERT"],["PW","Palaos","EXPERT"],
["TL","Timor oriental","EXPERT"],["ST","Sao Tomé-et-Principe","EXPERT"]
];

const $=id=>document.getElementById(id);
const canvas=$("screen");
const ctx=canvas.getContext("2d");
let quiz=[];
let images={};
let animation=null;
let busy=false;
let timeline=[];
let totalDuration=0;

function shuffle(a){
 let b=[...a];
 for(let i=b.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}

function chooseQuiz(){
 let mode=$("difficulty").value;
 let levels=mode==="mix"
 ?["FACILE","FACILE","MOYEN","DIFFICILE","EXPERT"]
 :mode==="hard"
 ?["MOYEN","DIFFICILE","DIFFICILE","EXPERT","EXPERT"]
 :Array.from({length:5},()=>["FACILE","MOYEN","DIFFICILE","EXPERT"][Math.floor(Math.random()*4)]);

 quiz=[];
 for(let level of shuffle(levels)){
  let pool=countries.filter(c=>c[2]===level&&!quiz.some(q=>q.country[0]===c[0]));
  if(!pool.length)pool=countries.filter(c=>!quiz.some(q=>q.country[0]===c[0]));
  let country=shuffle(pool)[0];
  let wrong=shuffle(countries.filter(c=>c[0]!==country[0])).slice(0,3);
  quiz.push({country,options:shuffle([country,...wrong])});
 }
}

function status(s){$("status").textContent=s}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}

function loadFlags(){
 let all=[...new Set(quiz.flatMap(q=>[q.country,...q.options].map(c=>c[0])))];
 return Promise.all(all.map(code=>new Promise((resolve,reject)=>{
  if(images[code])return resolve();
  let img=new Image();
  img.crossOrigin="anonymous";
  img.onload=()=>{images[code]=img;resolve()};
  img.onerror=()=>reject(Error("Drapeau impossible à charger : "+code));
  img.src="https://flagcdn.com/w640/"+code.toLowerCase()+".png";
 })));
}

function roundRect(x,y,w,h,r,color,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=color;
 ctx.fill();
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.lineWidth=3;
  ctx.stroke();
 }
}

function background(){
 let g=ctx.createLinearGradient(0,0,1080,1920);
 g.addColorStop(0,"#351052");
 g.addColorStop(.5,"#170725");
 g.addColorStop(1,"#080014");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,1080,1920);

 // Lumières décoratives
 let glow=ctx.createRadialGradient(300,300,20,300,300,600);
 glow.addColorStop(0,"#a43cff44");
 glow.addColorStop(1,"#a43cff00");
 ctx.fillStyle=glow;
 ctx.fillRect(0,0,1080,1000);

 ctx.fillStyle="#ffffff09";
 for(let i=0;i<35;i++){
  let x=(i*173)%1080;
  let y=(i*293)%1920;
  ctx.beginPath();
  ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fill();
 }
}

function text(txt,x,y,size,color,weight="bold"){
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font=weight+" "+size+"px Arial";
 ctx.fillStyle=color;
 ctx.fillText(txt,x,y);
}

function drawFlag(code,x,y,w,h){
 let img=images[code];
 if(!img)return;
 let ratio=Math.min(w/img.width,h/img.height);
 let iw=img.width*ratio,ih=img.height*ratio;
 ctx.save();
 ctx.shadowColor="#000";
 ctx.shadowBlur=30;
 roundRect(x-12,y-12,w+24,h+24,24,"#ffffff");
 ctx.restore();
 ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}

function drawHeader(){
 text("quizzzz123_",440,150,64,"#ff8bdf");
 roundRect(145,220,590,5,3,"#ffffff22");
}

function drawIntro(){
 background();
 drawHeader();
 text("🌍",440,610,115,"white");
 text("PRÊT À JOUER ?",440,790,65,"white");
 text($("intro").value,440,930,36,"#edcaff");
 roundRect(145,1080,590,100,28,"#32164e","#a34cff");
 text("5 DRAPEAUX  •  5 DÉFIS",440,1130,30,"#ff8bdf");
 text("RÉUSSIRAS-TU LE SANS-FAUTE ?",440,1300,25,"#d6b4f3");
}

function drawQuestion(index,local,reveal){
 background();
 drawHeader();

 // Barre de progression
 roundRect(130,270,620,13,8,"#ffffff25");
 roundRect(130,270,620*((index+1)/5),13,8,"#ed5bc9");

 text("QUESTION "+(index+1)+" / 5",440,365,34,"#e9c9ff");
 text(reveal?"RÉPONSE":"QUEL EST CE PAYS ?",440,465,43,"white");

 let q=quiz[index];
 drawFlag(q.country[0],235,565,410,255);

 // Grille 2 x 2, à gauche de la zone des boutons TikTok
 let positions=[
  [115,980],[450,980],
  [115,1200],[450,1200]
 ];
 q.options.forEach((option,i)=>{
  let [x,y]=positions[i];
  let correct=option[0]===q.country[0];
  let color=reveal&&correct?"#147a48":"#29163e";
  let stroke=reveal&&correct?"#55f0a0":"#68428a";
  roundRect(x,y,300,180,24,color,stroke);
  text(String(i+1),x+150,y+47,32,"#ff8bdd");
  ctx.font="bold 25px Arial";
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(option[1],x+150,y+115,260);
 });

 if(reveal){
  roundRect(125,1460,630,100,25,"#421b58","#f17bda");
  text("✓ "+q.country[1].toUpperCase(),440,1510,35,"white");
 }else{
  let remaining=Math.max(0,Math.ceil(6-local));
  ctx.beginPath();
  ctx.arc(440,1600,58,-Math.PI/2,-Math.PI/2+Math.PI*2*(remaining/6));
  ctx.strokeStyle="#ff70d7";
  ctx.lineWidth=12;
  ctx.stroke();
  text(String(remaining),440,1600,55,"white");
 }
}

function drawEnd(){
 background();
 drawHeader();
 text("🏆",440,600,120,"#ff8bdc");
 text("ALORS ?",440,800,65,"white");
 text("TON SCORE SUR 5",440,900,38,"#e6caff");
 text("?",440,1100,150,"#ff75d9");
 roundRect(120,1300,640,110,26,"#39164e","#a54cff");
 text("DIS TON SCORE EN COMMENTAIRE",440,1355,27,"white");
}

function drawAt(t){
 if(timeline.length===0){drawIntro();return}
 if(t<timeline[0].start){drawIntro();return}
 let scene=timeline.find(s=>t>=s.start&&t<s.end);
 if(!scene){drawEnd();return}
 if(scene.type==="question"){
  drawQuestion(scene.index,t-scene.start,false);
 }else if(scene.type==="reveal"){
  drawQuestion(scene.index,6,true);
 }else if(scene.type==="intro"){
  drawIntro();
 }else{
  drawEnd();
 }
}

// API vocale : génération de chaque phrase séparément
async function getVoice(){
 const response=await fetch("https://api.tts.ai/v1/voices/?language=fr");
 if(!response.ok)throw Error("Impossible de récupérer les voix françaises.");
 const data=await response.json();
 const voices=data.voices||[];
 const wanted=$("voice").value;
 let selected=voices.find(v=>
  (wanted==="female"?v.gender==="female":v.gender==="male") &&
  (v.language||"").toLowerCase().startsWith("fr")
 );
 if(!selected)selected=voices.find(v=>(v.language||"").toLowerCase().startsWith("fr"));
 if(!selected)throw Error("Aucune voix française disponible.");
 return selected.id;
}

async function speech(textValue,voice){
 const response=await fetch("https://api.tts.ai/v1/tts/",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   model:"kokoro",
   text:textValue,
   voice:voice,
   language:"fr",
   format:"mp3",
   speed:1
  })
 });
 if(!response.ok)throw Error("Erreur du service vocal : "+response.status);
 const job=await response.json();
 if(!job.uuid)throw Error("Réponse vocale invalide.");

 for(let i=0;i<90;i++){
  await wait(2000);
  const check=await fetch("https://api.tts.ai/v1/speech/results/?uuid="+encodeURIComponent(job.uuid));
  if(!check.ok)continue;
  const result=await check.json();
  if(result.status==="failed")throw Error("La voix n'a pas pu être générée.");
  if(result.status==="completed"&&result.result_url){
   const audioResponse=await fetch(result.result_url);
   if(!audioResponse.ok)throw Error("Impossible de télécharger la voix.");
   return await audioResponse.arrayBuffer();
  }
 }
 throw Error("La génération vocale est trop longue.");
}

async function makeAudioTimeline(audioContext){
 const voice=await getVoice();
 const segments=[];
 const intro=$("intro").value;

 status("Création de la voix d'introduction...");
 segments.push({
  type:"intro",
  buffer:await audioContext.decodeAudioData(await speech(intro,voice))
 });

 for(let i=0;i<quiz.length;i++){
  status("Création de la voix : question "+(i+1)+"/5...");
  let question=await speech("Drapeau numéro "+(i+1)+". Quel est ce pays ?",voice);
  let answer=await speech("La bonne réponse est "+quiz[i].country[1]+".",voice);
  segments.push({
   type:"question",
   index:i,
   buffer:await audioContext.decodeAudioData(question),
   answer:await audioContext.decodeAudioData(answer)
  });
 }

 status("Création de la conclusion...");
 segments.push({
  type:"outro",
  buffer:await audioContext.decodeAudioData(
   await speech("Tu as fait combien sur cinq ? Dis-le en commentaire !",voice)
  )
 });

 return segments;
}

function makeTimeline(segments){
 timeline=[];
 let cursor=0;
 let audioEvents=[];

 function addBuffer(buffer,type,index){
  let start=cursor;
  let end=start+buffer.duration;
  timeline.push({type,index,start,end});
  audioEvents.push({buffer,start});
  cursor=end;
 }

 addBuffer(segments[0].buffer,"intro",-1);
 cursor+=1;

 for(let i=1;i<=5;i++){
  let s=segments[i];
  addBuffer(s.buffer,"question",s.index);
  let questionEnd=cursor;
  // Six secondes de réflexion après la question parlée
  timeline.push({type:"question",index:s.index,start:questionEnd,end:questionEnd+6});
  cursor+=6;
  addBuffer(s.answer,"reveal",s.index);
  cursor+=1;
 }
 addBuffer(segments[6].buffer,"outro",-1);
 timeline.push({type:"end",start:cursor,end:cursor+2});
 cursor+=2;
 totalDuration=cursor;
 return audioEvents;
}

async function generate(){
 if(busy)return;
 busy=true;
 $("generate").disabled=true;
 let audioContext=null;
 let stream=null;
 let videoStream=null;
 let sources=[];

 try{
  if(!quiz.length)chooseQuiz();
  if(animation)cancelAnimationFrame(animation);

  status("Chargement des drapeaux...");
  await loadFlags();

  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  await audioContext.resume();

  const segments=await makeAudioTimeline(audioContext);
  const events=makeTimeline(segments);

  if(!canvas.captureStream||!window.MediaRecorder)
   throw Error("L'export vidéo n'est pas compatible avec ce navigateur. Essaie Chrome sur ordinateur.");

  const destination=audioContext.createMediaStreamDestination();
  const startAt=audioContext.currentTime+0.5;

  events.forEach(event=>{
   let source=audioContext.createBufferSource();
   source.buffer=event.buffer;
   source.connect(destination);
   source.start(startAt+event.start);
   sources.push(source);
  });

  videoStream=canvas.captureStream(30);
  stream=new MediaStream([
   ...videoStream.getVideoTracks(),
   ...destination.stream.getAudioTracks()
  ]);

  const formats=[
   "video/mp4",
   "video/webm;codecs=vp9,opus",
   "video/webm;codecs=vp8,opus",
   "video/webm"
  ];
  const mime=formats.find(x=>MediaRecorder.isTypeSupported(x));
  if(!mime)throw Error("Format vidéo non compatible.");

  const recorder=new MediaRecorder(stream,{mimeType:mime});
  let chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};

  const finished=new Promise((resolve,reject)=>{
   recorder.onstop=resolve;
   recorder.onerror=()=>reject(Error("Erreur d'enregistrement."));
  });

  recorder.start();
  const started=performance.now();

  while((performance.now()-started)/1000<totalDuration){
   let elapsed=(performance.now()-started)/1000;
   drawAt(elapsed);
   status("Montage vidéo : "+Math.min(99,Math.floor(elapsed/totalDuration*100))+" %");
   await wait(33);
  }

  drawEnd();
  recorder.stop();
  await finished;

  const blob=new Blob(chunks,{type:mime});
  const ext=mime.includes("mp4")?"mp4":"webm";
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="quizzzz123_"+Date.now()+"."+ext;
  document.body.appendChild(a);
  a.click();
  a.remove();

  status("Vidéo créée ! Vérifie tes téléchargements. Format : "+ext.toUpperCase());
  setTimeout(()=>URL.revokeObjectURL(url),60000);

 }catch(e){
  status("Erreur : "+e.message);
 }finally{
  sources.forEach(s=>{try{s.stop()}catch(e){}});
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(videoStream)videoStream.getTracks().forEach(t=>t.stop());
  if(audioContext)await audioContext.close();
  busy=false;
  $("generate").disabled=false;
 }
}

$("newQuiz").onclick=()=>{
 chooseQuiz();
 drawIntro();
 status("Nouveau quiz créé !");
};

$("previewBtn").onclick=async()=>{
 try{
  if(!quiz.length)chooseQuiz();
  await loadFlags();
  if(animation)cancelAnimationFrame(animation);
  let start=performance.now();
  function loop(now){
   let t=(now-start)/1000;
   let index=Math.floor(t/8);
   if(index>=5)drawEnd();
   else drawQuestion(index,t%8,t%8>=6);
   animation=requestAnimationFrame(loop);
  }
  animation=requestAnimationFrame(loop);
  status("Aperçu animé lancé.");
 }catch(e){status("Erreur : "+e.message)}
};

$("generate").onclick=generate;
chooseQuiz();
drawIntro();
</script>
</body>
</html>
